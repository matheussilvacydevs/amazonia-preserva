  <!-- Supabase Realtime Engine -->
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://uphdilhnxeytunuilimo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_mVgXx_dMlUAvfnqHQ-6tPg_sO4kIvcc";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: false
        }
      }
    );

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function normalizePlayer(row) {
      return {
        score: row.score ?? 0,
        streak: row.streak ?? 0,
        hasAnswered: row.has_answered ?? false,
        selectedIdx: row.selected_answer ?? null,
        isCorrect: row.is_correct ?? null,
        lastPoints: row.last_points ?? 0,

        // Dados internos usados pelo adaptador.
        __id: row.id,
        __userId: row.user_id
      };
    }

    function normalizeRoom(room, players = []) {
      if (!room) return null;

      const playerMap = {};

      for (const p of players || []) {
        playerMap[p.nickname] = normalizePlayer(p);
      }

      let questionStartTime = 0;

      if (room.question_started_at) {
        const parsed = new Date(room.question_started_at).getTime();

        if (!Number.isNaN(parsed)) {
          questionStartTime = parsed;
        }
      }

      return {
        __id: room.id,
        __hostId: room.host_id,

        pin: room.pin,
        hostName: room.host_name,
        status: room.status,

        questions: Array.isArray(room.questions)
          ? room.questions
          : [],

        currentQIndex: room.current_question ?? 0,

        questionStartTime,

        players: playerMap
      };
    }

    window.AmazoniaDB = {
      supabase,

      currentUser: null,

      channels: new Map(),

      async initAuth() {
        if (this.currentUser) {
          return this.currentUser;
        }

        let {
          data: { session }
        } = await supabase.auth.getSession();

        if (!session) {
          const { data, error } =
            await supabase.auth.signInAnonymously();

          if (error) {
            console.error(
              "Erro no login anônimo:",
              error
            );

            throw new Error(
              "Não foi possível conectar ao servidor multiplayer."
            );
          }

          session = data.session;
        }

        this.currentUser = session.user;

        return this.currentUser;
      },

      async isCurrentUserHost(room) {
        const user = await this.initAuth();

        return Boolean(
          room &&
          room.__hostId &&
          user &&
          room.__hostId === user.id
        );
      },

      async getRoomRow(pin) {
        const { data, error } = await supabase
          .from("quiz_rooms")
          .select("*")
          .eq("pin", String(pin))
          .maybeSingle();

        if (error) {
          console.error(
            "Erro ao localizar sala:",
            error
          );
          return null;
        }

        return data;
      },

      async getPlayers(roomId) {
        const { data, error } = await supabase
          .from("quiz_players")
          .select("*")
          .eq("room_id", roomId)
          .order("joined_at", {
            ascending: true
          });

        if (error) {
          console.error(
            "Erro ao carregar jogadores:",
            error
          );
          return [];
        }

        return data || [];
      },

      async getRoom(pin) {
        await this.initAuth();

        const room = await this.getRoomRow(pin);

        if (!room) return null;

        const players =
          await this.getPlayers(room.id);

        return normalizeRoom(
          room,
          players
        );
      },

      async createRoom(pin, roomData) {
        const user = await this.initAuth();

        // PIN extremamente improvável de colidir,
        // mas verificamos mesmo assim.
        const existing =
          await this.getRoomRow(pin);

        if (existing) {
          throw new Error(
            "PIN já utilizado. Gere outra sala."
          );
        }

        const questionCount =
          Array.isArray(roomData.questions)
            ? roomData.questions.length
            : 10;

        const { data: room, error } =
          await supabase
            .from("quiz_rooms")
            .insert({
              pin: String(pin),

              host_id: user.id,

              host_name:
                roomData.hostName,

              status:
                roomData.status || "lobby",

              question_count:
                questionCount,

              current_question:
                roomData.currentQIndex || 0,

              question_started_at:
                null,

              questions:
                roomData.questions || []
            })
            .select("*")
            .single();

        if (error) {
          console.error(
            "Erro ao criar sala:",
            error
          );
          throw error;
        }

        const hostData =
          roomData.players?.[
            roomData.hostName
          ] || {};

        const { error: playerError } =
          await supabase
            .from("quiz_players")
            .insert({
              room_id: room.id,
              user_id: user.id,

              nickname:
                roomData.hostName,

              score:
                hostData.score || 0,

              streak:
                hostData.streak || 0,

              has_answered: false,

              selected_answer: null,

              is_correct: null,

              last_points: 0
            });

        if (playerError) {
          console.error(
            "Erro ao registrar anfitrião:",
            playerError
          );

          // Evita deixar sala órfã.
          await supabase
            .from("quiz_rooms")
            .delete()
            .eq("id", room.id);

          throw playerError;
        }

        return await this.getRoom(pin);
      },

      async joinRoom(pin, nickname) {
        const user = await this.initAuth();

        const room = await this.getRoomRow(pin);

        if (!room) {
          throw new Error("Sala não encontrada.");
        }

        if (room.status !== "lobby") {
          throw new Error(
            "Esta partida já começou e não aceita novos jogadores."
          );
        }

        const cleanNickname = String(nickname || "").trim();

        if (!cleanNickname) {
          throw new Error("Apelido inválido.");
        }

        const { data: existingNickname, error: checkError } =
          await supabase
            .from("quiz_players")
            .select("id,user_id")
            .eq("room_id", room.id)
            .eq("nickname", cleanNickname)
            .maybeSingle();

        if (checkError) {
          console.error("Erro ao verificar apelido:", checkError);
          throw checkError;
        }

        if (existingNickname) {
          if (existingNickname.user_id === user.id) {
            return await this.getRoom(pin);
          }

          throw new Error(
            "Esse apelido já está sendo usado nessa sala."
          );
        }

        const { error } =
          await supabase
            .from("quiz_players")
            .insert({
              room_id: room.id,
              user_id: user.id,
              nickname: cleanNickname,
              score: 0,
              streak: 0,
              has_answered: false,
              selected_answer: null,
              is_correct: null,
              last_points: 0
            });

        if (error) {
          console.error("Erro ao entrar na sala:", error);

          if (error.code === "23505") {
            throw new Error(
              "Esse apelido já está sendo usado nessa sala."
            );
          }

          throw error;
        }

        return await this.getRoom(pin);
      },

      async kickPlayer(
        room,
        nickname
      ) {
        const user = await this.initAuth();

        if (!room || room.__hostId !== user.id) {
          throw new Error(
            "Somente o anfitrião pode remover jogadores."
          );
        }

        const cleanNickname =
          String(nickname || "").trim();

        if (!cleanNickname) {
          throw new Error("Jogador inválido.");
        }

        if (cleanNickname === room.hostName) {
          throw new Error(
            "O anfitrião não pode remover a si mesmo."
          );
        }

        const { error } =
          await supabase
            .from("quiz_players")
            .delete()
            .eq("room_id", room.__id)
            .eq("nickname", cleanNickname);

        if (error) {
          console.error(
            "Erro ao remover jogador:",
            cleanNickname,
            error
          );
          throw error;
        }
      },

      async resetPlayers(
        room,
        resetScore = false
      ) {
        const user = await this.initAuth();

        if (!room || room.__hostId !== user.id) {
          throw new Error(
            "Somente o anfitrião pode reiniciar jogadores."
          );
        }

        const payload = {
          has_answered: false,
          selected_answer: null,
          is_correct: null,
          last_points: 0
        };

        if (resetScore) {
          payload.score = 0;
          payload.streak = 0;
        }

        const { error } =
          await supabase
            .from("quiz_players")
            .update(payload)
            .eq("room_id", room.__id);

        if (error) {
          console.error(
            "Erro ao reiniciar jogadores:",
            error
          );
          throw error;
        }
      },

      async updateCurrentPlayer(
        room,
        updates
      ) {
        const user = await this.initAuth();

        const allowed = {
          hasAnswered: "has_answered",
          selectedIdx: "selected_answer",
          isCorrect: "is_correct",
          lastPoints: "last_points",
          streak: "streak",
          score: "score"
        };

        const payload = {};

        for (const [field, value] of Object.entries(updates || {})) {
          const dbField = allowed[field];

          if (dbField) {
            payload[dbField] = value;
          }
        }

        if (!Object.keys(payload).length) {
          return;
        }

        const { error } =
          await supabase
            .from("quiz_players")
            .update(payload)
            .eq("room_id", room.id)
            .eq("user_id", user.id);

        if (error) {
          console.error(
            "Erro ao atualizar jogador atual:",
            error
          );
          throw error;
        }
      },

      async updateRoom(
        pin,
        updateData
      ) {
        await this.initAuth();

        const room =
          await this.getRoomRow(pin);

        if (!room) {
          throw new Error(
            "Sala não encontrada."
          );
        }

        const user = this.currentUser;

        if (!user || room.host_id !== user.id) {
          throw new Error(
            "Somente o anfitrião pode alterar a partida."
          );
        }

        const roomPayload = {};

        for (
          const [key, value]
          of Object.entries(updateData)
        ) {
          switch (key) {
            case "status":
              roomPayload.status =
                value;
              break;

            case "questions":
              roomPayload.questions =
                value;

              roomPayload.question_count =
                Array.isArray(value)
                  ? value.length
                  : room.question_count;

              break;

            case "currentQIndex":
              roomPayload.current_question =
                value;
              break;

            case "questionStartTime":
              roomPayload.question_started_at =
                value
                  ? new Date(value)
                      .toISOString()
                  : null;
              break;

            case "hostName":
              roomPayload.host_name =
                value;
              break;
          }
        }

        if (
          Object.keys(roomPayload)
            .length
        ) {
          const { error } =
            await supabase
              .from("quiz_rooms")
              .update(roomPayload)
              .eq("id", room.id);

          if (error) {
            console.error(
              "Erro ao atualizar sala:",
              error
            );
            throw error;
          }
        }

        return await this.getRoom(pin);
      },

      listenRoom(pin, onUpdate) {
        let active = true;
        let channel = null;
        let roomId = null;

        const refresh = async () => {
          if (!active) return;

          try {
            const data =
              await this.getRoom(pin);

            if (
              active &&
              data
            ) {
              onUpdate(data);
            }
          } catch (e) {
            console.error(
              "Erro ao sincronizar sala:",
              e
            );
          }
        };

        const start = async () => {
          try {
            await this.initAuth();

            const room =
              await this.getRoomRow(pin);

            if (
              !active ||
              !room
            ) {
              return;
            }

            roomId = room.id;

            await refresh();

            channel =
              supabase.channel(
                "quiz-room-" +
                roomId +
                "-" +
                Math.random()
                  .toString(36)
                  .slice(2)
              );

            channel.on(
              "postgres_changes",
              {
                event: "*",
                schema: "public",
                table: "quiz_rooms",
                filter:
                  "id=eq." +
                  roomId
              },
              refresh
            );

            channel.on(
              "postgres_changes",
              {
                event: "*",
                schema: "public",
                table: "quiz_players",
                filter:
                  "room_id=eq." +
                  roomId
              },
              refresh
            );

            channel.subscribe(
              status => {
                console.log(
                  "Supabase Realtime:",
                  status
                );
              }
            );
          } catch (e) {
            console.error(
              "Falha no Realtime:",
              e
            );
          }
        };

        start();

        /*
         * Realtime é o mecanismo principal.
         * Polling é apenas fallback caso uma conexão móvel
         * perca temporariamente o WebSocket.
         */
        const fallback =
          setInterval(
            refresh,
            5000
          );

        return () => {
          active = false;

          clearInterval(
            fallback
          );

          if (channel) {
            supabase.removeChannel(
              channel
            );
          }
        };
      }
    };

    // Inicializa a sessão antecipadamente.
    window.AmazoniaDB
      .initAuth()
      .then(user => {
        console.log(
          "✅ Supabase conectado:",
          user.id
        );
      })
      .catch(err => {
        console.error(
          "❌ Supabase:",
          err
        );
      });

  </script>

    // --- COMPONENT: ERROR BOUNDARY ---
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() {
        return { hasError: true };
      }
      componentDidCatch(err, info) {
        console.error("ErrorBoundary:", err, info);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-stone-900 text-white flex items-center justify-center p-6 text-center">

                  Recarregar Aplicação

    // --- SOLO QUIZ ENGINE ---
    function SoloQuizEngine({ questions, onBack }) {
      const [qCount, setQCount] = useState(7);
      const [difficulty, setDifficulty] = useState('Aleatório');
      const [started, setStarted] = useState(false);
      const [activeQuestions, setActiveQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);

      // Game run state
      const [timer, setTimer] = useState(35);
      const [selectedOption, setSelectedOption] = useState(null);
      const [score, setScore] = useState(0);
      const [answersHistory, setAnswersHistory] = useState([]);
      const [finished, setFinished] = useState(false);

      const timerRef = useRef(null);

      // Prepare quiz set
      const startQuiz = () => {
        let filtered = [...questions];
        if (difficulty !== 'Aleatório') {
          filtered = filtered.filter(q => q.difficulty === difficulty);
        }
        if (filtered.length < 3) filtered = [...questions]; // fallback

        // Shuffle
        filtered = filtered.sort(() => Math.random() - 0.5).slice(0, Math.min(qCount, filtered.length));
        
        // Shuffle alternatives
        const prepared = filtered.map(q => {
          const optsWithIdx = q.options.map((opt, i) => ({ opt, originalIdx: i }));
          const shuffledOpts = optsWithIdx.sort(() => Math.random() - 0.5);
          const newCorrectIdx = shuffledOpts.findIndex(item => item.originalIdx === q.correctIndex);
          return {
            ...q,
            options: shuffledOpts.map(item => item.opt),
            correctIndex: newCorrectIdx
          };
        });

        setActiveQuestions(prepared);
        setCurrentIndex(0);
        setScore(0);
        setAnswersHistory([]);
        setFinished(false);
        setStarted(true);
        setTimer(35);
        setSelectedOption(null);
      };

      // Timer effect
      useEffect(() => {
        if (started && !finished && selectedOption === null) {
          timerRef.current = setInterval(() => {
            setTimer(prev => {
              if (prev <= 1) {
                clearInterval(timerRef.current);
                handleSelectOption(-1); // timeout
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timerRef.current);
      }, [started, finished, currentIndex, selectedOption]);

      const handleSelectOption = (index) => {
        if (selectedOption !== null) return;
        clearInterval(timerRef.current);
        setSelectedOption(index);

        const q = activeQuestions[currentIndex];
        const isCorrect = index === q.correctIndex;
        let pointsEarned = 0;

        if (isCorrect) {
          // Speed bonus: 500 base + up to 500 based on remaining time
          pointsEarned = 500 + Math.round((timer / 35) * 500);
          setScore(prev => prev + pointsEarned);
        }

        setAnswersHistory(prev => [...prev, {
          question: q.question,
          isCorrect,
          pointsEarned,
          timeSpent: 35 - timer
        }]);
      };

      const handleNextQuestion = () => {
        if (currentIndex + 1 < activeQuestions.length) {
          setCurrentIndex(prev => prev + 1);
          setSelectedOption(null);
          setTimer(35);
        } else {
          setFinished(true);
        }
      };

      if (!started) {
        return (
          <div className="max-w-xl mx-auto px-4 py-12 space-y-6">
            <button onClick={onBack} className="text-xs font-bold text-stone-500 hover:text-stone-800 flex items-center space-x-1">
              <i className="fa-solid fa-arrow-left"></i>
              <span>Voltar</span>
            </button>

            <div className="bg-white p-8 rounded-3xl border border-stone-200 shadow-md space-y-6">
              <div className="border-b border-stone-100 pb-4">
                <h2 className="text-2xl font-bold text-stone-900">Configurar Partida Solo</h2>
                <p className="text-xs text-stone-600 mt-1">Ajuste os parâmetros antes de iniciar.</p>
              </div>

              <div className="space-y-4">
                <div>
                  <label className="text-xs font-bold text-stone-700 block mb-2">Quantidade de Perguntas</label>
                  <div className="grid grid-cols-6 gap-2">
                    {[7, 8, 9, 10, 11, 12].map(n => (
                      <button
                        key={n}
                        onClick={() => setQCount(n)}
                        className={`py-2 rounded-xl text-xs font-bold border ${
                          qCount === n
                            ? 'bg-amazon-700 text-white border-amazon-700'
                            : 'bg-stone-50 text-stone-700 border-stone-200 hover:bg-stone-100'
                        }`}
                      >
                        {n}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="text-xs font-bold text-stone-700 block mb-2">Dificuldade</label>
                  <div className="grid grid-cols-4 gap-2">
                    {['Aleatório', 'Fácil', 'Médio', 'Difícil'].map(d => (
                      <button
                        key={d}
                        onClick={() => setDifficulty(d)}
                        className={`py-2 rounded-xl text-xs font-bold border ${
                          difficulty === d
                            ? 'bg-amazon-700 text-white border-amazon-700'
                            : 'bg-stone-50 text-stone-700 border-stone-200 hover:bg-stone-100'
                        }`}
                      >
                        {d}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <button
                onClick={startQuiz}
                className="w-full py-4 bg-amazon-600 hover:bg-amazon-500 text-white font-extrabold text-sm rounded-2xl shadow-lg transition"
              >
                Começar Desafio Solo
              </button>
            </div>
          </div>
        );
      }

      if (finished) {
        const total = activeQuestions.length;
        const correctCount = answersHistory.filter(a => a.isCorrect).length;
        const pct = Math.round((correctCount / total) * 100);
        const avgTime = (answersHistory.reduce((acc, a) => acc + a.timeSpent, 0) / total).toFixed(1);

        let feedbackMsg = "";
        if (pct >= 90) feedbackMsg = "Excelente! Você demonstrou um ótimo conhecimento sobre a Amazônia.";
        else if (pct >= 70) feedbackMsg = "Muito bom! Você conhece bastante sobre a preservação e biodiversidade.";
        else if (pct >= 50) feedbackMsg = "Bom começo! Continue aprendendo sobre a preservação da Amazônia.";
        else feedbackMsg = "Que tal conhecer mais sobre o conteúdo educativo e tentar novamente?";

        return (
          <div className="max-w-2xl mx-auto px-4 py-12 space-y-6 text-center">
            <div className="bg-white p-8 sm:p-12 rounded-3xl border border-stone-200 shadow-xl space-y-6">
              <div className="w-16 h-16 bg-amazon-100 text-amazon-700 rounded-2xl flex items-center justify-center text-3xl mx-auto">
                🏆
              </div>

              <div className="space-y-2">
                <h2 className="text-2xl font-black text-stone-900">Resultado do Quiz</h2>
                <p className="text-xs text-stone-600">{feedbackMsg}</p>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 pt-4 border-t border-stone-100">
                <div className="p-3 bg-stone-50 rounded-2xl border border-stone-100">
                  <div className="text-[10px] text-stone-400 uppercase font-bold">Pontuação</div>
                  <div className="text-lg font-black text-amazon-700">{score.toLocaleString()}</div>
                </div>
                <div className="p-3 bg-stone-50 rounded-2xl border border-stone-100">
                  <div className="text-[10px] text-stone-400 uppercase font-bold">Acertos</div>
                  <div className="text-lg font-black text-stone-900">{correctCount}/{total}</div>
                </div>
                <div className="p-3 bg-stone-50 rounded-2xl border border-stone-100">
                  <div className="text-[10px] text-stone-400 uppercase font-bold">Aproveitamento</div>
                  <div className="text-lg font-black text-stone-900">{pct}%</div>
                </div>
                <div className="p-3 bg-stone-50 rounded-2xl border border-stone-100">
                  <div className="text-[10px] text-stone-400 uppercase font-bold">Tempo Médio</div>
                  <div className="text-lg font-black text-stone-900">{avgTime}s</div>
                </div>
              </div>

              <div className="pt-4 flex gap-3">
                <button onClick={startQuiz} className="flex-1 py-3.5 bg-amazon-700 hover:bg-amazon-600 text-white font-bold text-xs rounded-xl transition">
                  Jogar Novamente
                </button>
                <button onClick={onBack} className="flex-1 py-3.5 bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold text-xs rounded-xl transition">
                  Sair do Quiz
                </button>
              </div>
            </div>
          </div>
        );
      }

      const currentQ = activeQuestions[currentIndex];

      return (
        <div className="max-w-3xl mx-auto px-4 py-8 space-y-6">
          {/* HEADER STATUS */}
          <div className="flex items-center justify-between bg-white p-4 rounded-2xl border border-stone-200 shadow-sm">
            <span className="text-xs font-bold text-stone-500">
              Pergunta <strong className="text-stone-900">{currentIndex + 1}</strong> de {activeQuestions.length}
            </span>
            <div className="flex items-center space-x-2">
              <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-black text-sm ${
                timer <= 5 ? 'bg-red-500 text-white animate-bounce' : 'bg-stone-100 text-stone-800'
              }`}>
                {timer}s
              </div>
            </div>
            <div className="text-xs font-bold text-amazon-700">
              {score} pts
            </div>
          </div>

          {/* QUESTION CARD */}
          <div className="bg-white p-6 sm:p-8 rounded-3xl border border-stone-200 shadow-md space-y-6">
            <div className="inline-block px-3 py-1 rounded-full bg-stone-100 text-[10px] font-bold text-stone-600 uppercase">
              {currentQ.category} • {currentQ.difficulty}
            </div>
            <h2 className="text-lg sm:text-xl font-extrabold text-stone-900 leading-snug">
              {currentQ.question}
            </h2>

            {/* OPTIONS */}
            <div className="grid grid-cols-1 gap-3">
              {currentQ.options.map((opt, idx) => {
                let btnStyle = "bg-stone-50 text-stone-800 border-stone-200 hover:bg-stone-100";
                if (selectedOption !== null) {
                  if (idx === currentQ.correctIndex) {
                    btnStyle = "bg-emerald-600 text-white border-emerald-600 font-bold";
                  } else if (idx === selectedOption) {
                    btnStyle = "bg-red-600 text-white border-red-600";
                  } else {
                    btnStyle = "bg-stone-50 text-stone-400 border-stone-200 opacity-50";
                  }
                }

                return (
                  <button
                    key={idx}
                    disabled={selectedOption !== null}
                    onClick={() => handleSelectOption(idx)}
                    className={`w-full p-4 rounded-2xl text-left text-xs sm:text-sm font-medium border-2 transition flex items-start space-x-3 ${btnStyle}`}
                  >
                    <span className="w-6 h-6 rounded-lg bg-black/10 flex items-center justify-center text-[10px] font-bold shrink-0">
                      {String.fromCharCode(65 + idx)}
                    </span>
                    <span className="leading-relaxed">{opt}</span>
                  </button>
                );
              })}
            </div>

            {/* EXPLANATION & NEXT BUTTON */}
            {selectedOption !== null && (
              <div className="pt-4 border-t border-stone-100 space-y-4 animate-fade-in">
                <div className="p-4 rounded-2xl bg-amazon-50 border border-amazon-200 text-xs text-amazon-950 space-y-1">
                  <div className="font-bold flex items-center space-x-1 text-amazon-800">
                    <i className="fa-solid fa-circle-info"></i>
                    <span>Explicação Científica:</span>
                  </div>
                  <p className="leading-relaxed">{currentQ.explanation}</p>
                </div>

                <button
                  onClick={handleNextQuestion}
                  className="w-full py-3.5 bg-amazon-700 hover:bg-amazon-600 text-white font-bold text-xs rounded-xl shadow transition"
                >
                  {currentIndex + 1 === activeQuestions.length ? 'Ver Resultado Final' : 'Próxima Pergunta →'}
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- MULTIPLAYER QUIZ ENGINE (OTIMIZADO & REFORÇADO) ---
    function MultiplayerQuizEngine({ questions, onBack }) {
      const [viewState, setViewState] = useState('menu'); // 'menu', 'create', 'join', 'room'
      const [playerName, setPlayerName] = useState('');
      const [roomPin, setRoomPin] = useState('');
      const [currentRoom, setCurrentRoom] = useState(null);
      const [qCount, setQCount] = useState(7);
      const [timer, setTimer] = useState(35);
      const [copiedPin, setCopiedPin] = useState(false);

      // Ouvinte em tempo real da sala
      useEffect(() => {
        if (roomPin && window.AmazoniaDB) {
          const unsub = window.AmazoniaDB.listenRoom(roomPin, (data) => {
            if (data) setCurrentRoom(data);
          });
          return () => unsub();
        }
      }, [roomPin]);

      // Cronômetro sincronizado
      useEffect(() => {
        if (currentRoom && currentRoom.status === 'question' && currentRoom.questionStartTime) {
          const interval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - currentRoom.questionStartTime) / 1000);
            const remaining = Math.max(0, 35 - elapsed);
            setTimer(remaining);
          }, 400);
          return () => clearInterval(interval);
        }
      }, [currentRoom?.status, currentRoom?.questionStartTime, currentRoom?.currentQIndex]);

      // Confetti e celebração no pódio
      useEffect(() => {
        if (currentRoom && currentRoom.status === 'finished' && typeof confetti === 'function') {
          confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
        }
      }, [currentRoom?.status]);

      // Copiar PIN da Sala
      const handleCopyPin = () => {
        if (!currentRoom) return;
        navigator.clipboard.writeText(currentRoom.pin);
        setCopiedPin(true);
        setTimeout(() => setCopiedPin(false), 2000);
      };

      // Criar Nova Sala
      const handleCreateRoom = async () => {
        const cleanName = playerName.trim();
        if (!cleanName) return alert('Por favor, digite seu nome ou apelido!');
        const pin = Math.floor(100000 + Math.random() * 900000).toString();

        const selectedQ = [...questions].sort(() => Math.random() - 0.5).slice(0, qCount);

        const newRoomData = {
          pin,
          hostName: cleanName,
          status: 'lobby',
          questions: selectedQ,
          currentQIndex: 0,
          questionStartTime: 0,
          players: {
            [cleanName]: {
              score: 0,
              streak: 0,
              hasAnswered: false,
              selectedIdx: null,
              isCorrect: null,
              lastPoints: 0
            }
          }
        };

        await window.AmazoniaDB.createRoom(pin, newRoomData);
        setRoomPin(pin);
        setPlayerName(cleanName);
        setViewState('room');
      };

      // Entrar em Sala Existente
      const handleJoinRoom = async () => {
        const cleanName = playerName.trim();
        const cleanPin = roomPin.replace(/\D/g, '').slice(0, 6);
        if (!cleanName) return alert('Por favor, digite seu apelido!');
        if (cleanPin.length !== 6) return alert('O código PIN deve possuir exatamente 6 dígitos.');

        const roomData = await window.AmazoniaDB.getRoom(cleanPin);

        if (!roomData) {
          return alert('Sala não encontrada! Verifique se o código PIN está correto.');
        }

        try {
          await window.AmazoniaDB.joinRoom(cleanPin, cleanName);

          setRoomPin(cleanPin);
          setPlayerName(cleanName);
          setViewState('room');
        } catch (e) {
          console.error(e);
          alert(e?.message || 'Não foi possível entrar na sala.');
        }
      };

      // Anfitrião remove jogador inativo/indesejado
      const handleKickPlayer = async (targetPlayer) => {
        if (!currentRoom || currentRoom.hostName !== playerName) return;
        if (targetPlayer === playerName) return alert('Você é o anfitrião e não pode se remover!');

        await window.AmazoniaDB.kickPlayer(
          currentRoom,
          targetPlayer
        );
      };

      // Anfitrião Inicia/Reinicia a Partida
      const handleStartGame = async () => {
        if (!currentRoom) return;

        // Se estiver reiniciando no fim da partida, sorteia novas perguntas
        const newQuestions = currentRoom.status === 'finished' 
          ? [...questions].sort(() => Math.random() - 0.5).slice(0, currentRoom.questions.length || qCount)
          : currentRoom.questions;

        await window.AmazoniaDB.resetPlayers(
          currentRoom,
          true
        );

        await window.AmazoniaDB.updateRoom(roomPin, {
          status: 'question',
          questions: newQuestions,
          currentQIndex: 0,
          questionStartTime: Date.now()
        });
      };

      if (viewState === 'menu') {
        return (
          <div className="max-w-md mx-auto px-4 py-12 space-y-6 text-center">
            <button onClick={onBack} className="text-xs font-bold text-stone-500 hover:text-stone-800 flex items-center space-x-1">
              <i className="fa-solid fa-arrow-left"></i>
              <span>Voltar</span>
            </button>

            <div className="bg-white p-8 rounded-3xl border border-stone-200 shadow-md space-y-6">
              <div className="w-12 h-12 bg-fire-100 text-fire-600 rounded-2xl flex items-center justify-center text-2xl mx-auto font-bold">
                👥
              </div>
              <div>
                <h2 className="text-2xl font-black text-stone-900">Quiz Multiplayer</h2>
                <p className="text-xs text-stone-500 mt-1">Dispute simultaneamente em tempo real com amigos.</p>
              </div>

              <div className="space-y-3">
                <button
                  onClick={() => setViewState('create')}
                  className="w-full py-4 bg-fire-600 hover:bg-fire-500 text-white font-bold text-xs rounded-2xl shadow transition flex items-center justify-center space-x-2"
                >
                  <i className="fa-solid fa-plus"></i>
                  <span>Criar Nova Sala</span>
                </button>
                <button
                  onClick={() => setViewState('join')}
                  className="w-full py-4 bg-amazon-700 hover:bg-amazon-600 text-white font-bold text-xs rounded-2xl shadow transition flex items-center justify-center space-x-2"
                >
                  <i className="fa-solid fa-right-to-bracket"></i>
                  <span>Entrar com Código PIN</span>
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (viewState === 'create') {
        return (
          <div className="max-w-md mx-auto px-4 py-12 space-y-6">
            <button onClick={() => setViewState('menu')} className="text-xs font-bold text-stone-500 hover:text-stone-800 flex items-center space-x-1">
              <i className="fa-solid fa-arrow-left"></i>
              <span>Voltar ao Menu</span>
            </button>
            <div className="bg-white p-8 rounded-3xl border border-stone-200 shadow-md space-y-4">
              <h3 className="font-bold text-lg text-stone-900">Criar Sala de Desafio</h3>
              <div>
                <label className="text-xs font-bold text-stone-600 block mb-1">Seu Nome / Apelido</label>
                <input
                  type="text"
                  placeholder="Ex: Maria"
                  value={playerName}
                  onChange={e => setPlayerName(e.target.value)}
                  className="w-full p-3 border rounded-xl text-xs focus:ring-2 focus:ring-fire-500 outline-none"
                />
              </div>
              <div>
                <label className="text-xs font-bold text-stone-600 block mb-1">Quantidade de Perguntas</label>
                <select value={qCount} onChange={e => setQCount(Number(e.target.value))} className="w-full p-3 border rounded-xl text-xs focus:ring-2 focus:ring-fire-500 outline-none">
                  <option value={7}>7 Perguntas</option>
                  <option value={10}>10 Perguntas</option>
                  <option value={12}>12 Perguntas</option>
                </select>
              </div>
              <button onClick={handleCreateRoom} className="w-full py-3.5 bg-fire-600 hover:bg-fire-500 text-white font-bold text-xs rounded-xl shadow transition">
                Gerar Sala e Código PIN
              </button>
            </div>
          </div>
        );
      }

      if (viewState === 'join') {
        return (
          <div className="max-w-md mx-auto px-4 py-12 space-y-6">
            <button onClick={() => setViewState('menu')} className="text-xs font-bold text-stone-500 hover:text-stone-800 flex items-center space-x-1">
              <i className="fa-solid fa-arrow-left"></i>
              <span>Voltar ao Menu</span>
            </button>
            <div className="bg-white p-8 rounded-3xl border border-stone-200 shadow-md space-y-4">
              <h3 className="font-bold text-lg text-stone-900">Entrar em Partida</h3>
              <div>
                <label className="text-xs font-bold text-stone-600 block mb-1">Código PIN da Sala (6 dígitos)</label>
                <input
                  type="text"
                  placeholder="Ex: 482917"
                  value={roomPin}
                  inputMode="numeric"
                  maxLength={6}
                  onChange={e => setRoomPin(e.target.value.replace(/\D/g, '').slice(0, 6))}
                  className="w-full p-3 border rounded-xl text-xs font-mono font-bold text-center tracking-widest text-lg focus:ring-2 focus:ring-amazon-500 outline-none"
                />
              </div>
              <div>
                <label className="text-xs font-bold text-stone-600 block mb-1">Seu Apelido</label>
                <input
                  type="text"
                  placeholder="Ex: João"
                  value={playerName}
                  onChange={e => setPlayerName(e.target.value)}
                  className="w-full p-3 border rounded-xl text-xs focus:ring-2 focus:ring-amazon-500 outline-none"
                />
              </div>
              <button onClick={handleJoinRoom} className="w-full py-3.5 bg-amazon-700 hover:bg-amazon-600 text-white font-bold text-xs rounded-xl shadow transition">
                Entrar na Sala
              </button>
            </div>
          </div>
        );
      }

      if (viewState === 'room' && currentRoom) {
        const isHost =
          currentRoom.__hostId ===
          window.AmazoniaDB.currentUser?.id;

        const playerList = Object.keys(currentRoom.players || {});

        // LOBBY STATE
        if (currentRoom.status === 'lobby') {
          return (
            <div className="max-w-lg mx-auto px-4 py-12 space-y-6 text-center">
              <div className="bg-white p-8 rounded-3xl border border-stone-200 shadow-xl space-y-6">
                <span className="text-[10px] font-bold text-stone-400 uppercase tracking-widest block">Código PIN da Sala</span>
                
                <div className="flex items-center justify-center space-x-3">
                  <div className="text-4xl font-black text-fire-600 font-mono tracking-widest bg-stone-50 px-6 py-3 rounded-2xl border border-stone-200 shadow-inner">
                    {currentRoom.pin}
                  </div>
                  <button
                    onClick={handleCopyPin}
                    className="p-3 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-2xl transition border border-stone-200"
                    title="Copiar Código"
                  >
                    <i className={`fa-solid ${copiedPin ? 'fa-check text-emerald-600' : 'fa-copy'}`}></i>
                  </button>
                </div>
                {copiedPin && <p className="text-[11px] text-emerald-600 font-bold animate-fade-in">✓ Código PIN copiado!</p>}

                <div className="border-t border-stone-100 pt-5 text-left space-y-3">
                  <div className="flex justify-between items-center text-xs font-bold text-stone-600">
                    <span>Jogadores Conectados ({playerList.length})</span>
                    <span className="text-[10px] text-stone-400 font-normal">Sua tela atualiza automaticamente</span>
                  </div>

                  <div className="flex flex-wrap gap-2">
                    {playerList.map(p => (
                      <span key={p} className="px-3.5 py-2 bg-stone-50 text-stone-800 rounded-xl text-xs font-bold border border-stone-200 flex items-center space-x-2">
                        <span>👤</span>
                        <span>{p}</span>
                        {p === currentRoom.hostName && <span className="text-[9px] bg-fire-100 text-fire-700 px-1.5 py-0.5 rounded font-bold">HOST</span>}
                        {isHost && p !== playerName && (
                          <button
                            onClick={() => handleKickPlayer(p)}
                            className="text-stone-400 hover:text-red-500 ml-1 text-xs"
                            title="Remover jogador"
                          >
                            ✕
                          </button>
                        )}
                      </span>
                    ))}
                  </div>
                </div>

                {isHost ? (
                  <button onClick={handleStartGame} className="w-full py-4 bg-fire-600 hover:bg-fire-500 text-white font-extrabold text-xs rounded-2xl shadow transition">
                    Iniciar Partida Multiplayer ({playerList.length} conectados)
                  </button>
                ) : (
                  <div className="p-4 bg-amber-50 border border-amber-200 rounded-2xl text-xs text-amber-800 flex items-center justify-center space-x-2 animate-pulse">
                    <i className="fa-solid fa-spinner fa-spin"></i>
                    <span>Aguardando o anfitrião <strong>{currentRoom.hostName}</strong> iniciar...</span>
                  </div>
                )}
              </div>
            </div>
          );
        }

        // QUESTION STATE IN MULTIPLAYER
        if (currentRoom.status === 'question') {
          const currentQ = currentRoom.questions[currentRoom.currentQIndex];
          const playerInfo = currentRoom.players?.[playerName] || {};
          const playersArray = Object.entries(currentRoom.players || {});
          const answeredCount = playersArray.filter(([_, p]) => p.hasAnswered).length;
          const totalPlayers = playersArray.length;
          const timeIsUp = timer === 0;
          const allAnswered = answeredCount === totalPlayers && totalPlayers > 0;
          const showResults = timeIsUp || allAnswered;

          const handleAnswerMP = async (idx) => {
            if (!currentRoom || !playerName || playerInfo.hasAnswered || timeIsUp) return;

            const isCorrect = idx === currentQ.correctIndex;
            const currentStreak = isCorrect ? (playerInfo.streak || 0) + 1 : 0;
            const streakBonus = isCorrect ? (currentStreak - 1) * 100 : 0;
            const speedBonus = isCorrect ? Math.round((timer / 35) * 500) : 0;
            const pointsEarned = isCorrect ? 500 + speedBonus + streakBonus : 0;
            const newScore = (playerInfo.score || 0) + pointsEarned;

            await window.AmazoniaDB.updateCurrentPlayer(
              currentRoom,
              {
                hasAnswered: true,
                selectedIdx: idx,
                isCorrect,
                lastPoints: pointsEarned,
                streak: currentStreak,
                score: newScore
              }
            );
          };

          const handleNextMP = async () => {
            if (!isHost) return;
            const nextIdx = currentRoom.currentQIndex + 1;

            if (nextIdx < currentRoom.questions.length) {
              await window.AmazoniaDB.resetPlayers(
                currentRoom,
                false
              );

              await window.AmazoniaDB.updateRoom(roomPin, {
                status: 'question',
                currentQIndex: nextIdx,
                questionStartTime: Date.now()
              });
            } else {
              await window.AmazoniaDB.updateRoom(roomPin, { status: 'finished' });
            }
          };

          // Barra de progresso do cronômetro
          const timerPercentage = Math.round((timer / 35) * 100);

          return (
            <div className="max-w-2xl mx-auto px-4 py-8 space-y-6">
              {/* TOP STATUS BAR */}
              <div className="bg-white p-4 rounded-2xl border border-stone-200 shadow-sm space-y-3">
                <div className="flex items-center justify-between">
                  <div>
                    <span className="text-xs font-bold text-stone-500 block">
                      Pergunta <strong className="text-stone-900">{currentRoom.currentQIndex + 1}</strong> de {currentRoom.questions.length}
                    </span>
                    <span className="text-[10px] text-stone-400 font-semibold">
                      Respostas: <strong className="text-amazon-700">{answeredCount}/{totalPlayers}</strong> jogadores
                    </span>
                  </div>

                  <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-black text-sm ${
                    timer <= 5 ? 'bg-red-500 text-white animate-bounce' : 'bg-stone-100 text-stone-800'
                  }`}>
                    {timer}s
                  </div>

                  <div className="text-right">
                    <span className="text-[10px] text-stone-400 uppercase font-bold block">Pontuação</span>
                    <span className="text-xs font-black text-amazon-700">{playerInfo.score || 0} pts</span>
                  </div>
                </div>

                {/* VISUAL TIMER BAR */}
                <div className="w-full bg-stone-100 h-1.5 rounded-full overflow-hidden">
                  <div
                    className={`h-full transition-all duration-500 ${
                      timerPercentage > 50 ? 'bg-emerald-500' : timerPercentage > 20 ? 'bg-amber-500' : 'bg-red-500'
                    }`}
                    style={{ width: `${timerPercentage}%` }}
                  ></div>
                </div>
              </div>

              {/* QUESTION CARD */}
              <div className="bg-white p-6 sm:p-8 rounded-3xl border border-stone-200 shadow-md space-y-6">
                <div className="flex justify-between items-center">
                  <div className="inline-block px-3 py-1 rounded-full bg-stone-100 text-[10px] font-bold text-stone-600 uppercase">
                    {currentQ.category} • {currentQ.difficulty}
                  </div>
                  {playerInfo.streak > 1 && (
                    <div className="px-2.5 py-1 bg-amber-100 text-amber-800 rounded-full text-[10px] font-bold flex items-center space-x-1">
                      <span>🔥</span>
                      <span>Sequência {playerInfo.streak}x</span>
                    </div>
                  )}
                </div>

                <h2 className="text-lg sm:text-xl font-extrabold text-stone-900 leading-snug">
                  {currentQ.question}
                </h2>

                {/* OPTIONS */}
                <div className="grid grid-cols-1 gap-3">
                  {currentQ.options.map((opt, i) => {
                    let btnStyle = "bg-stone-50 text-stone-800 hover:bg-stone-100 border-stone-200";

                    if (showResults) {
                      if (i === currentQ.correctIndex) {
                        btnStyle = "bg-emerald-600 text-white border-emerald-600 font-bold shadow-md";
                      } else if (playerInfo.selectedIdx === i) {
                        btnStyle = "bg-red-600 text-white border-red-600 font-bold";
                      } else {
                        btnStyle = "bg-stone-50 text-stone-400 border-stone-200 opacity-40";
                      }
                    }

                    return (
                      <button
                        key={i}
                        disabled={showResults}
                        onClick={() => handleAnswerMP(i)}
                        className={`w-full p-4 rounded-2xl text-left text-xs sm:text-sm font-medium border-2 transition flex items-center justify-between ${btnStyle}`}
                      >
                        <div className="flex items-start space-x-3">
                          <span className="w-6 h-6 rounded-lg bg-black/10 flex items-center justify-center text-[10px] font-bold shrink-0">
                            {String.fromCharCode(65 + i)}
                          </span>
                          <span className="leading-relaxed">{opt}</span>
                        </div>
                        {showResults && i === currentQ.correctIndex && (
                          <span className="text-[10px] bg-white/20 px-2 py-0.5 rounded-full shrink-0 ml-2">✓ Correta</span>
                        )}
                        {showResults && playerInfo.selectedIdx === i && i !== currentQ.correctIndex && (
                          <span className="text-[10px] bg-white/20 px-2 py-0.5 rounded-full shrink-0 ml-2">✕ Sua Escolha</span>
                        )}
                      </button>
                    );
                  })}
                </div>

                {/* EXPLANATION & FEEDBACK */}
                {showResults && (
                  <div className="pt-4 border-t border-stone-100 space-y-4 animate-fade-in">
                    <div className="p-4 rounded-2xl bg-amazon-50 border border-amazon-200 text-xs text-amazon-950 space-y-1">
                      <div className="font-bold flex items-center space-x-1 text-amazon-800">
                        <i className="fa-solid fa-circle-info"></i>
                        <span>Explicação Científica:</span>
                      </div>
                      <p className="leading-relaxed">{currentQ.explanation}</p>
                    </div>

                    {playerInfo.hasAnswered && playerInfo.isCorrect && (
                      <div className="p-3 bg-emerald-100 text-emerald-900 border border-emerald-300 rounded-xl text-xs font-bold text-center">
                        🎉 Resposta correta! +{playerInfo.lastPoints} pontos acumulados!
                      </div>
                    )}
                    {playerInfo.hasAnswered && !playerInfo.isCorrect && (
                      <div className="p-3 bg-red-100 text-red-900 border border-red-300 rounded-xl text-xs font-bold text-center">
                        ❌ Resposta incorreta nesta rodada.
                      </div>
                    )}
                    {!playerInfo.hasAnswered && (
                      <div className="p-3 bg-amber-100 text-amber-900 border border-amber-300 rounded-xl text-xs font-bold text-center">
                        {allAnswered ? '⚡ Rodada finalizada antecipadamente pois todos já responderam!' : '⏰ Tempo esgotado para esta questão!'}
                      </div>
                    )}

                    {isHost ? (
                      <button
                        onClick={handleNextMP}
                        className="w-full py-3.5 bg-fire-600 hover:bg-fire-500 text-white font-extrabold text-xs rounded-xl shadow transition"
                      >
                        {currentRoom.currentQIndex + 1 === currentRoom.questions.length ? 'Finalizar Partida e Ver Pódio →' : 'Avançar para Próxima Questão →'}
                      </button>
                    ) : (
                      <p className="text-xs text-center font-semibold text-stone-500 italic animate-pulse">
                        Aguardando o anfitrião {currentRoom.hostName} avançar...
                      </p>
                    )}
                  </div>
                )}
              </div>

              {/* LIVE PLAYER STATUS / LEADERBOARD */}
              <div className="bg-white p-4 rounded-2xl border border-stone-200 shadow-sm space-y-3">
                <div className="text-xs font-bold text-stone-700 flex justify-between items-center">
                  <span>Placar em Tempo Real</span>
                  <span className="text-[10px] text-stone-400">{answeredCount}/{totalPlayers} Responderam</span>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  {playersArray
                    .sort((a, b) => (b[1].score || 0) - (a[1].score || 0))
                    .map(([pName, pData], rankIdx) => (
                      <div
                        key={pName}
                        className={`p-2.5 rounded-xl border text-xs flex justify-between items-center ${
                          pName === playerName ? 'bg-amazon-50 border-amazon-300 font-bold' : 'bg-stone-50 border-stone-200'
                        }`}
                      >
                        <div className="flex items-center space-x-2">
                          <span className="font-mono text-[10px] text-stone-400">#{rankIdx + 1}</span>
                          <span className={pData.hasAnswered ? 'text-emerald-600' : 'text-stone-300'}>
                            {pData.hasAnswered ? '✓' : '⏳'}
                          </span>
                          <span className="truncate max-w-[120px]">{pName}</span>
                        </div>
                        <span className="font-mono text-stone-800 font-bold">{pData.score || 0} pts</span>
                      </div>
                    ))}
                </div>
              </div>
            </div>
          );
        }

        // PODIUM / FINISHED STATE
        if (currentRoom.status === 'finished') {
          const sorted = Object.entries(currentRoom.players || {})
            .map(([name, data]) => ({ name, ...data }))
            .sort((a, b) => b.score - a.score);

          return (
            <div className="max-w-lg mx-auto px-4 py-12 space-y-6 text-center">
              <div className="bg-white p-8 rounded-3xl border border-stone-200 shadow-2xl space-y-6">
                <div className="text-5xl">🏆</div>
                <div>
                  <h2 className="text-2xl font-black text-stone-900">Pódio Final da Partida</h2>
                  <p className="text-xs text-stone-500 mt-1">Parabéns aos participantes pelo aprendizado!</p>
                </div>

                <div className="space-y-3 pt-4 border-t border-stone-100">
                  {sorted.map((p, idx) => (
                    <div
                      key={p.name}
                      className={`p-4 rounded-2xl flex items-center justify-between text-xs font-bold ${
                        idx === 0
                          ? 'bg-amber-100 text-amber-900 border border-amber-300 shadow-sm'
                          : idx === 1
                          ? 'bg-slate-100 text-slate-800 border border-slate-300'
                          : idx === 2
                          ? 'bg-amber-50 text-amber-800 border border-amber-200'
                          : 'bg-stone-50 text-stone-800 border border-stone-200'
                      }`}
                    >
                      <div className="flex items-center space-x-3">
                        <span className="text-base">{idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`}</span>
                        <span>{p.name}</span>
                      </div>
                      <span className="font-mono">{p.score} pts</span>
                    </div>
                  ))}
                </div>

                <div className="pt-2 flex flex-col sm:flex-row gap-3">
                  {isHost && (
                    <button
                      onClick={handleStartGame}
                      className="flex-1 py-3.5 bg-fire-600 hover:bg-fire-500 text-white font-bold text-xs rounded-xl shadow transition"
                    >
                      🔄 Jogar Novamente nesta Sala
                    </button>
                  )}
                  <button
                    onClick={onBack}
                    className="flex-1 py-3.5 bg-stone-100 hover:bg-stone-200 text-stone-800 font-bold text-xs rounded-xl transition"
                  >
                    Sair para a Central
                  </button>
                </div>
              </div>
            </div>
          );
        }
      }

      return null;
    }

    // --- RENDER REACT ROOT ---
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
